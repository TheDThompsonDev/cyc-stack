<svg xmlns="http://www.w3.org/2000/svg" width="450" height="530" viewBox="0 0 450 530" role="img" aria-labelledby="title desc">
  <title id="title">Carry the reasoning forward</title>
  <desc id="desc">Retrieve and recheck project knowledge, apply team standards to the next change, verify the result and retain lessons for future work.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1"><stop stop-color="#111d3a"/><stop offset="1" stop-color="#182f49"/></linearGradient>
    <marker id="forward" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="m0 0 7 3.5L0 7" fill="#73e0cc"/></marker>
  </defs>
  <rect width="450" height="530" rx="20" fill="url(#surface)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="32" y="36" fill="#73e0cc" font-size="12" font-weight="700" letter-spacing="2">CONTEXT ENGINEERING</text>
    <text x="31" y="80" fill="#f5f8ff" font-size="31" font-weight="700" letter-spacing="-.6">Carry the reasoning</text>
    <text x="31" y="115" fill="#f5f8ff" font-size="31" font-weight="700" letter-spacing="-.6">forward.</text>
    <text x="32" y="144" fill="#bfcee5" font-size="15">The next task starts with the team's knowledge.</text>
    <path d="M37 205V275M37 315V385" fill="none" stroke="#73e0cc" stroke-width="2"/>
    <path d="m33 269 4 7 4-7m-8 110 4 7 4-7" fill="none" stroke="#73e0cc" stroke-width="2"/>
    <circle cx="37" cy="190" r="6" fill="#73e0cc"/>
    <text x="64" y="197" fill="#f5f8ff" font-size="24" font-weight="650">Project knowledge</text>
    <text x="64" y="222" fill="#bfcee5" font-size="15">Decisions, constraints, failure history</text>
    <text x="64" y="244" fill="#73e0cc" font-size="12" font-weight="700" letter-spacing="1.2">RETRIEVE + RECHECK</text>
    <circle cx="37" cy="300" r="6" fill="#85b8ff"/>
    <text x="64" y="307" fill="#f5f8ff" font-size="24" font-weight="650">The next change</text>
    <text x="64" y="332" fill="#bfcee5" font-size="15">Team standards, scoped work</text>
    <text x="64" y="354" fill="#85b8ff" font-size="12" font-weight="700" letter-spacing="1.2">APPLY + BUILD</text>
    <circle cx="37" cy="410" r="6" fill="#f2ce82"/>
    <text x="64" y="417" fill="#f5f8ff" font-size="24" font-weight="650">Reviewable evidence</text>
    <text x="64" y="442" fill="#bfcee5" font-size="15">Checks, findings, remaining limits</text>
    <text x="64" y="464" fill="#f2ce82" font-size="12" font-weight="700" letter-spacing="1.2">VERIFY + HAND OFF</text>
    <path d="M37 425v55q0 12-12 12h-3q-10 0-10-12V187q0-12 12-12h12" fill="none" stroke="#73e0cc" stroke-opacity=".6" stroke-width="1.5" marker-end="url(#forward)"/>
    <text x="64" y="504" fill="#d1e9e4" font-size="13">Retain verified lessons for future work</text>
  </g>
</svg>
