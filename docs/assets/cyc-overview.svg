<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1030" viewBox="0 0 1200 1030" role="img" aria-labelledby="overview-title overview-desc" font-family="Segoe UI, Arial, sans-serif"><title id="overview-title">CYC Stack team workflow</title><desc id="overview-desc">Your AI assistant reuses and revalidates project knowledge, builds a focused change and retains useful findings before final checks, proves applicable tests against original code, runs configured checks and reviews consumers, then delivers evidence and context pointers. The local controller checks records and executes project commands; an active host hook enforces delivery. Failed checks return to repair within the retry budget. Teams share through their existing project review process; run logs are local by default.</desc><defs><marker id="overview-forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#197f70"/></marker><marker id="overview-knowledge" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7044b4"/></marker><marker id="overview-retry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b86b0a"/></marker></defs><rect x="0" y="0" width="1200" height="1030" rx="14" fill="white" stroke="none" stroke-width="2"/>
<text x="48" y="43" fill="#197f70" font-size="16" font-weight="700" text-anchor="start"><tspan x="48" dy="0">CYC STACK / TEAM WORKFLOW</tspan></text>
<text x="48" y="88" fill="#16225a" font-size="35" font-weight="800" text-anchor="start"><tspan x="48" dy="0">Shared project knowledge. Reviewable AI changes.</tspan></text>
<rect x="48" y="116" width="1104" height="60" rx="14" fill="#eaf3ff" stroke="#2b69b0" stroke-width="2"/>
<text x="72" y="154" fill="#16225a" font-size="23" font-weight="600" text-anchor="start"><tspan x="72" dy="0">Describe the outcome. Your AI assistant selects the relevant methods through /cyc.</tspan></text>
<rect x="48" y="202" width="1104" height="132" rx="14" fill="#f5effc" stroke="#7044b4" stroke-width="2"/>
<text x="72" y="235" fill="#7044b4" font-size="16" font-weight="700" text-anchor="start"><tspan x="72" dy="0">PROJECT KNOWLEDGE IN YOUR REPO</tspan></text>
<text x="72" y="268" fill="#16225a" font-size="23" font-weight="600" text-anchor="start"><tspan x="72" dy="0">Reuse matched decisions, constraints, failed approaches and check recipes.</tspan></text>
<text x="72" y="300" fill="#334362" font-size="20" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Revalidate current code. Keep useful verified facts; label proposals and record acceptance for adopted decisions.</tspan></text>
<polyline points="174,334 174,400" fill="none" stroke="#7044b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#overview-knowledge)"/>
<text x="196" y="373" fill="#7044b4" font-size="17" font-weight="600" text-anchor="start"><tspan x="196" dy="0">Read + revalidate</tspan></text>
<polyline points="458,400 458,334" fill="none" stroke="#7044b4" stroke-width="3" stroke-linejoin="round" marker-end="url(#overview-knowledge)"/>
<text x="478" y="373" fill="#7044b4" font-size="17" font-weight="600" text-anchor="start"><tspan x="478" dy="0">Retain before final checks</tspan></text>
<rect x="48" y="400" width="252" height="200" rx="14" fill="#e6f5ef" stroke="#197f70" stroke-width="2"/>
<text x="68" y="439" fill="#16225a" font-size="27" font-weight="800" text-anchor="start"><tspan x="68" dy="0">1. SCOUT</tspan></text>
<text x="68" y="471" fill="#197f70" font-size="18" font-weight="600" text-anchor="start"><tspan x="68" dy="0">Understand the change</tspan></text>
<text x="68" y="514" fill="#334362" font-size="20" font-weight="400" text-anchor="start"><tspan x="68" dy="0">Read relevant history.</tspan><tspan x="68" dy="29">Trace affected paths.</tspan><tspan x="68" dy="29">Set criteria and checks.</tspan></text>
<polyline points="300,500 332,500" fill="none" stroke="#197f70" stroke-width="3" stroke-linejoin="round" marker-end="url(#overview-forward)"/>
<rect x="332" y="400" width="252" height="200" rx="14" fill="#e6f5ef" stroke="#197f70" stroke-width="2"/>
<text x="352" y="439" fill="#16225a" font-size="27" font-weight="800" text-anchor="start"><tspan x="352" dy="0">2. BUILD</tspan></text>
<text x="352" y="471" fill="#197f70" font-size="18" font-weight="600" text-anchor="start"><tspan x="352" dy="0">Make a focused change</tspan></text>
<text x="352" y="514" fill="#334362" font-size="20" font-weight="400" text-anchor="start"><tspan x="352" dy="0">Change one useful slice.</tspan><tspan x="352" dy="29">Check affected behavior.</tspan><tspan x="352" dy="29">Retain useful findings.</tspan></text>
<polyline points="584,500 616,500" fill="none" stroke="#197f70" stroke-width="3" stroke-linejoin="round" marker-end="url(#overview-forward)"/>
<rect x="616" y="400" width="252" height="200" rx="14" fill="#e6f5ef" stroke="#197f70" stroke-width="2"/>
<text x="636" y="439" fill="#16225a" font-size="27" font-weight="800" text-anchor="start"><tspan x="636" dy="0">3. VERIFY</tspan></text>
<text x="636" y="471" fill="#197f70" font-size="18" font-weight="600" text-anchor="start"><tspan x="636" dy="0">Establish current evidence</tspan></text>
<text x="636" y="514" fill="#334362" font-size="20" font-weight="400" text-anchor="start"><tspan x="636" dy="0">Original-code proof.*</tspan><tspan x="636" dy="29">Your configured checks.</tspan><tspan x="636" dy="29">Intent + consumer review.</tspan></text>
<polyline points="868,500 900,500" fill="none" stroke="#197f70" stroke-width="3" stroke-linejoin="round" marker-end="url(#overview-forward)"/>
<rect x="900" y="400" width="252" height="200" rx="14" fill="#e6f5ef" stroke="#197f70" stroke-width="2"/>
<text x="920" y="439" fill="#16225a" font-size="27" font-weight="800" text-anchor="start"><tspan x="920" dy="0">4. DELIVER</tspan></text>
<text x="920" y="471" fill="#197f70" font-size="18" font-weight="600" text-anchor="start"><tspan x="920" dy="0">Leave a useful handoff</tspan></text>
<text x="920" y="514" fill="#334362" font-size="20" font-weight="400" text-anchor="start"><tspan x="920" dy="0">Outcome and limits.</tspan><tspan x="920" dy="29">A generated review.</tspan><tspan x="920" dy="29">Useful context pointers.</tspan></text>
<polyline points="742,600 742,665 458,665 458,600" fill="none" stroke="#b86b0a" stroke-width="3" stroke-linejoin="round" marker-end="url(#overview-retry)"/>
<text x="600" y="696" fill="#b86b0a" font-size="19" font-weight="600" text-anchor="middle"><tspan x="600" dy="0">Failed checks return to repair within the same retry budget.</tspan></text>
<text x="48" y="740" fill="#16225a" font-size="22" font-weight="700" text-anchor="start"><tspan x="48" dy="0">The assistant does the engineering. Code checks the recorded evidence.</tspan></text>
<rect x="48" y="765" width="536" height="128" rx="14" fill="#f3f6fa" stroke="#ced9e5" stroke-width="2"/>
<text x="72" y="800" fill="#16225a" font-size="23" font-weight="700" text-anchor="start"><tspan x="72" dy="0">LOCAL CONTROLLER</tspan></text>
<text x="72" y="833" fill="#334362" font-size="19" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Scope, current file evidence and retry budgets.</tspan><tspan x="72" dy="29">Runs the project’s configured commands.</tspan></text>
<rect x="616" y="765" width="536" height="128" rx="14" fill="#eaf3ff" stroke="#2b69b0" stroke-width="2"/>
<text x="640" y="800" fill="#16225a" font-size="23" font-weight="700" text-anchor="start"><tspan x="640" dy="0">ACTIVE HOST HOOK</tspan></text>
<text x="640" y="833" fill="#334362" font-size="19" font-weight="400" text-anchor="start"><tspan x="640" dy="0">Enforces delivery when the hook is active.</tspan><tspan x="640" dy="29">A ready result or an honest blocked handoff.</tspan></text>
<text x="48" y="927" fill="#334362" font-size="17" font-weight="400" text-anchor="start"><tspan x="48" dy="0">* Original-code proof for applicable feature, bug-fix and refactor runs; exemptions are recorded.</tspan></text>
<text x="48" y="964" fill="#16225a" font-size="22" font-weight="700" text-anchor="start"><tspan x="48" dy="0">Your team reviews and shares. Publication requires authorization.</tspan></text>
<text x="48" y="995" fill="#334362" font-size="18" font-weight="400" text-anchor="start"><tspan x="48" dy="0">Run logs stay local by default. Share useful project docs and review evidence through your normal process.</tspan></text></svg>
