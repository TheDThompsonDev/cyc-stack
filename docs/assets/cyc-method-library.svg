<svg xmlns="http://www.w3.org/2000/svg" width="2020" height="1300" viewBox="0 0 2020 1300" role="img" aria-labelledby="methods-title methods-desc" font-family="Segoe UI, Arial, sans-serif"><title id="methods-title">CYC complete method-selection map</title><desc id="methods-desc">The cyc orchestrator chooses methods by task need. All seventeen supporting methods have a selection condition and output. These are capabilities, not seventeen mandatory steps. Examples are available in each method's accessible description; links open its source instructions.</desc><defs><marker id="select-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2b69b0"/></marker></defs><rect width="2020" height="1300" fill="white"/><text x="40" y="54" font-size="40" font-weight="800" fill="#16225a">CYC · the full method library</text>
<text x="40" y="96" font-size="22" font-weight="400" fill="#334362">1 orchestrator selects from 17 methods and 15 playbooks. Four stages describe only the common implementation route.</text>
<text x="40" y="134" font-size="19" font-weight="400" fill="#334362">Arrows show selection by need. Rows group responsibilities; they are not an execution sequence. Click a method to read its instructions.</text>
<g data-method="cyc"><a href="../../skills/cyc/SKILL.md"><rect x="40" y="540" width="250" height="180" rx="12" fill="#eaf3ff" stroke="#2b69b0" stroke-width="2"/><text x="60" y="578" font-size="30" font-weight="800" fill="#16225a">/cyc</text><text x="60" y="616" font-size="21" font-weight="700" fill="#334362">Own the outcome</text><text x="60" y="650" font-size="18" font-weight="400" fill="#334362">Choose the playbook</text><text x="60" y="681" font-size="18" font-weight="400" fill="#334362">Load relevant methods</text></a></g>
<path d="M290 630 H320 V217 H350" fill="none" stroke="#2b69b0" stroke-width="2" marker-end="url(#select-arrow)"/>
<rect x="350" y="190" width="1630" height="230" rx="12" fill="#f7f9fc" stroke="#ced9e5"/>
<text x="370" y="219" font-size="21" font-weight="700" fill="#16225a">ENTER, RECOVER OR EXPLAIN</text>
<text x="370" y="247" font-size="18" font-weight="400" fill="#334362">Project setup, task entry, interruption or requested learning</text>
<g data-method="setup"><a href="../../methods/cyc-setup/SKILL.md" aria-label="Setup: Project needs configuration. Example: discover CI commands, run them and disclose hook status."><title>Example: discover CI commands, run them and disclose hook status.</title><rect x="370" y="268" width="385.5" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="384" y="296" font-size="23" font-weight="700" fill="#16225a">Setup</text><text x="384" y="326" font-size="16" font-weight="400" fill="#334362">Project needs configuration</text><text x="384" y="347" font-size="16" font-weight="400" fill="#334362">→ real checks + activation status</text></a></g>
<g data-method="scout"><a href="../../methods/cyc-scout/SKILL.md" aria-label="Scout: Start a bounded engineering task. Example: locate the export path and the permission checks it must preserve."><title>Example: locate the export path and the permission checks it must preserve.</title><rect x="771.5" y="268" width="385.5" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="785.5" y="296" font-size="23" font-weight="700" fill="#16225a">Scout</text><text x="785.5" y="326" font-size="16" font-weight="400" fill="#334362">Start a bounded engineering task</text><text x="785.5" y="347" font-size="16" font-weight="400" fill="#334362">→ plan, consumers + checks</text></a></g>
<g data-method="remember"><a href="../../methods/cyc-remember/SKILL.md" aria-label="Remember: Decision, checkpoint or resumption. Example: recover why a query was chosen; recheck files changed since the checkpoint."><title>Example: recover why a query was chosen; recheck files changed since the checkpoint.</title><rect x="1173" y="268" width="385.5" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="1187" y="296" font-size="23" font-weight="700" fill="#16225a">Remember</text><text x="1187" y="326" font-size="16" font-weight="400" fill="#334362">Decision, checkpoint or resumption</text><text x="1187" y="347" font-size="16" font-weight="400" fill="#334362">→ decision log + revalidated next step</text></a></g>
<g data-method="teach"><a href="../../methods/cyc-teach/SKILL.md" aria-label="Teach: Engineer requests a lesson. Example: explain why visible page rows differ from all matching export records."><title>Example: explain why visible page rows differ from all matching export records.</title><rect x="1574.5" y="268" width="385.5" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="1588.5" y="296" font-size="23" font-weight="700" fill="#16225a">Teach</text><text x="1588.5" y="326" font-size="16" font-weight="400" fill="#334362">Engineer requests a lesson</text><text x="1588.5" y="347" font-size="16" font-weight="400" fill="#334362">→ project-grounded explanation / practice</text></a></g>
<path d="M290 630 H320 V472 H350" fill="none" stroke="#2b69b0" stroke-width="2" marker-end="url(#select-arrow)"/>
<rect x="350" y="445" width="1630" height="230" rx="12" fill="#f7f9fc" stroke="#ced9e5"/>
<text x="370" y="474" font-size="21" font-weight="700" fill="#16225a">RESOLVE THE ENGINEERING QUESTION</text>
<text x="370" y="502" font-size="18" font-weight="400" fill="#334362">Unclear goal, behavior, alternatives, impact, design or claim</text>
<g data-method="frame"><a href="../../methods/cyc-frame/SKILL.md" aria-label="Frame: What counts as success?. Example: all matching rows, not merely a downloaded CSV."><title>Example: all matching rows, not merely a downloaded CSV.</title><rect x="370" y="523" width="251.66666666666666" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="384" y="551" font-size="23" font-weight="700" fill="#16225a">Frame</text><text x="384" y="581" font-size="16" font-weight="400" fill="#334362">What counts as success?</text><text x="384" y="602" font-size="16" font-weight="400" fill="#334362">→ criteria + scope</text></a></g>
<g data-method="understand"><a href="../../methods/cyc-understand/SKILL.md" aria-label="Understand: Why does it behave this way?. Example: trace pagination from request to query."><title>Example: trace pagination from request to query.</title><rect x="637.6666666666666" y="523" width="251.66666666666666" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="651.6666666666666" y="551" font-size="23" font-weight="700" fill="#16225a">Understand</text><text x="651.6666666666666" y="581" font-size="16" font-weight="400" fill="#334362">Why does it behave this</text><text x="651.6666666666666" y="602" font-size="16" font-weight="400" fill="#334362">way?</text><text x="651.6666666666666" y="623" font-size="16" font-weight="400" fill="#334362">→ traced cause + evidence</text></a></g>
<g data-method="explore"><a href="../../methods/cyc-explore/SKILL.md" aria-label="Explore: Which approach fits?. Example: compare paged fetch, streaming and queued export."><title>Example: compare paged fetch, streaming and queued export.</title><rect x="905.3333333333333" y="523" width="251.66666666666666" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="919.3333333333333" y="551" font-size="23" font-weight="700" fill="#16225a">Explore</text><text x="919.3333333333333" y="581" font-size="16" font-weight="400" fill="#334362">Which approach fits?</text><text x="919.3333333333333" y="602" font-size="16" font-weight="400" fill="#334362">→ compared options +</text><text x="919.3333333333333" y="623" font-size="16" font-weight="400" fill="#334362">recommendation</text></a></g>
<g data-method="impact"><a href="../../methods/cyc-impact/SKILL.md" aria-label="Impact: What else could this affect?. Example: find permission and count consumers of the query."><title>Example: find permission and count consumers of the query.</title><rect x="1173" y="523" width="251.66666666666666" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="1187" y="551" font-size="23" font-weight="700" fill="#16225a">Impact</text><text x="1187" y="581" font-size="16" font-weight="400" fill="#334362">What else could this</text><text x="1187" y="602" font-size="16" font-weight="400" fill="#334362">affect?</text><text x="1187" y="623" font-size="16" font-weight="400" fill="#334362">→ dependencies + checks</text></a></g>
<g data-method="design"><a href="../../methods/cyc-design/SKILL.md" aria-label="Design: How should the change work?. Example: define the export/query boundary and errors."><title>Example: define the export/query boundary and errors.</title><rect x="1440.6666666666665" y="523" width="251.66666666666666" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="1454.6666666666665" y="551" font-size="23" font-weight="700" fill="#16225a">Design</text><text x="1454.6666666666665" y="581" font-size="16" font-weight="400" fill="#334362">How should the change</text><text x="1454.6666666666665" y="602" font-size="16" font-weight="400" fill="#334362">work?</text><text x="1454.6666666666665" y="623" font-size="16" font-weight="400" fill="#334362">→ shape, contracts +</text><text x="1454.6666666666665" y="644" font-size="16" font-weight="400" fill="#334362">trade-offs</text></a></g>
<g data-method="challenge"><a href="../../methods/cyc-challenge/SKILL.md" aria-label="Challenge: Does the plan or claim hold?. Example: question whether the export bypasses access filtering."><title>Example: question whether the export bypasses access filtering.</title><rect x="1708.333333333333" y="523" width="251.66666666666666" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="1722.333333333333" y="551" font-size="23" font-weight="700" fill="#16225a">Challenge</text><text x="1722.333333333333" y="581" font-size="16" font-weight="400" fill="#334362">Does the plan or claim</text><text x="1722.333333333333" y="602" font-size="16" font-weight="400" fill="#334362">hold?</text><text x="1722.333333333333" y="623" font-size="16" font-weight="400" fill="#334362">→ supported objections +</text><text x="1722.333333333333" y="644" font-size="16" font-weight="400" fill="#334362">resolution</text></a></g>
<path d="M290 630 H320 V727 H350" fill="none" stroke="#2b69b0" stroke-width="2" marker-end="url(#select-arrow)"/>
<rect x="350" y="700" width="1630" height="230" rx="12" fill="#f7f9fc" stroke="#ced9e5"/>
<text x="370" y="729" font-size="21" font-weight="700" fill="#16225a">PRODUCE AND ESTABLISH THE RESULT</text>
<text x="370" y="757" font-size="18" font-weight="400" fill="#334362">Implement, verify or hand off the selected task</text>
<g data-method="build"><a href="../../methods/cyc-build/SKILL.md" aria-label="Build: An agreed approach needs implementation. Example: repair retrieval in small slices; check duplicates before continuing."><title>Example: repair retrieval in small slices; check duplicates before continuing.</title><rect x="370" y="778" width="519.3333333333334" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="384" y="806" font-size="23" font-weight="700" fill="#16225a">Build</text><text x="384" y="836" font-size="16" font-weight="400" fill="#334362">An agreed approach needs implementation</text><text x="384" y="857" font-size="16" font-weight="400" fill="#334362">→ tested slices + inspected changes</text></a></g>
<g data-method="verify"><a href="../../methods/cyc-verify/SKILL.md" aria-label="Verify: A behavior claim needs current evidence. Example: inspect the full exported membership, permissions and CSV consumer."><title>Example: inspect the full exported membership, permissions and CSV consumer.</title><rect x="905.3333333333334" y="778" width="519.3333333333334" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="919.3333333333334" y="806" font-size="23" font-weight="700" fill="#16225a">Verify</text><text x="919.3333333333334" y="836" font-size="16" font-weight="400" fill="#334362">A behavior claim needs current evidence</text><text x="919.3333333333334" y="857" font-size="16" font-weight="400" fill="#334362">→ checks, consumer results + limits</text></a></g>
<g data-method="deliver"><a href="../../methods/cyc-deliver/SKILL.md" aria-label="Deliver: The result needs a reviewable handoff. Example: explain the query change, show checks and identify unmeasured scale."><title>Example: explain the query change, show checks and identify unmeasured scale.</title><rect x="1440.6666666666667" y="778" width="519.3333333333334" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="1454.6666666666667" y="806" font-size="23" font-weight="700" fill="#16225a">Deliver</text><text x="1454.6666666666667" y="836" font-size="16" font-weight="400" fill="#334362">The result needs a reviewable handoff</text><text x="1454.6666666666667" y="857" font-size="16" font-weight="400" fill="#334362">→ outcome, evidence + remaining limits</text></a></g>
<path d="M290 630 H320 V982 H350" fill="none" stroke="#2b69b0" stroke-width="2" marker-end="url(#select-arrow)"/>
<rect x="350" y="955" width="1630" height="230" rx="12" fill="#f7f9fc" stroke="#ced9e5"/>
<text x="370" y="984" font-size="21" font-weight="700" fill="#16225a">PRESERVE KNOWLEDGE AND RESPOND TO FINDINGS</text>
<text x="370" y="1012" font-size="18" font-weight="400" fill="#334362">Relevant history, failed attempts, user correction or reusable lessons</text>
<g data-method="context"><a href="../../methods/cyc-context/SKILL.md" aria-label="Context: Before component work; useful findings. Example: retain observed query constraints with evidence; identify adopted decisions only with actual acceptance."><title>Example: retain observed query constraints with evidence; identify adopted decisions only with actual acceptance.</title><rect x="370" y="1033" width="385.5" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="384" y="1061" font-size="23" font-weight="700" fill="#16225a">Context</text><text x="384" y="1091" font-size="16" font-weight="400" fill="#334362">Before component work; useful findings</text><text x="384" y="1112" font-size="16" font-weight="400" fill="#334362">→ verified facts / pending proposals</text></a></g>
<g data-method="error-ledger"><a href="../../methods/cyc-error-ledger/SKILL.md" aria-label="Error Ledger: Before debugging; after failed attempts. Example: record that a paging fix duplicated rows and the check that exposed it."><title>Example: record that a paging fix duplicated rows and the check that exposed it.</title><rect x="771.5" y="1033" width="385.5" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="785.5" y="1061" font-size="23" font-weight="700" fill="#16225a">Error Ledger</text><text x="785.5" y="1091" font-size="16" font-weight="400" fill="#334362">Before debugging; after failed attempts</text><text x="785.5" y="1112" font-size="16" font-weight="400" fill="#334362">→ signatures, attempts + confirmed causes</text></a></g>
<g data-method="correct"><a href="../../methods/cyc-correct/SKILL.md" aria-label="Correct: Feedback reveals a missing criterion. Example: “Not just the visible page” changes the target and its verification."><title>Example: “Not just the visible page” changes the target and its verification.</title><rect x="1173" y="1033" width="385.5" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="1187" y="1061" font-size="23" font-weight="700" fill="#16225a">Correct</text><text x="1187" y="1091" font-size="16" font-weight="400" fill="#334362">Feedback reveals a missing criterion</text><text x="1187" y="1112" font-size="16" font-weight="400" fill="#334362">→ targeted repair + rechecked criteria</text></a></g>
<g data-method="reflect"><a href="../../methods/cyc-reflect/SKILL.md" aria-label="Reflect: An outcome reveals a reusable improvement. Example: propose a multi-page check after a repeated omission; do not silently adopt rules."><title>Example: propose a multi-page check after a repeated omission; do not silently adopt rules.</title><rect x="1574.5" y="1033" width="385.5" height="136" rx="8" fill="white" stroke="#2b69b0"/><text x="1588.5" y="1061" font-size="23" font-weight="700" fill="#16225a">Reflect</text><text x="1588.5" y="1091" font-size="16" font-weight="400" fill="#334362">An outcome reveals a reusable improvement</text><text x="1588.5" y="1112" font-size="16" font-weight="400" fill="#334362">→ evidence-backed proposals to</text><text x="1588.5" y="1133" font-size="16" font-weight="400" fill="#334362">skills/checks</text></a></g>
<text x="40" y="1230" font-size="19" font-weight="400" fill="#334362">The playbook sets the recorded sequence; the agent selects methods and interprets their findings. The controller does not invoke skills.</text>
