name: Release

# A matching tag builds the GitHub release; npm publication is a separate manual workflow.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node scripts/check-distribution.mjs "$RELEASE_TAG"
      - run: node --test
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then echo "::error::CHANGELOG.md has no section for $version"; exit 1; fi
      - name: Pack installable archive
        run: |
          mkdir release-assets
          npm pack --ignore-scripts --pack-destination release-assets
          cd release-assets
          sha256sum *.tgz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "CYC Stack $GITHUB_REF_NAME" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" release-assets/*.tgz release-assets/SHA256SUMS --clobber
